<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 لعبة الثعبان</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --snake-head: #39ff14;
    --snake-body: #1aff00;
    --food: #ff3860;
    --grid: #1a1a2e;
    --text: #e0e0ff;
    --accent: #39ff14;
    --glow: 0 0 20px #39ff1466;
  }

  body {
    background: var(--bg);
    font-family: 'Cairo', sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 16px;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at top, #0d1f0d 0%, #0a0a0f 60%);
    z-index: -1;
  }

  h1 {
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--accent);
    text-shadow: var(--glow);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .score-row {
    display: flex;
    gap: 24px;
    margin-bottom: 12px;
    font-size: 0.9rem;
    opacity: 0.8;
  }

  .score-box {
    background: var(--surface);
    border: 1px solid #39ff1433;
    border-radius: 8px;
    padding: 4px 16px;
    text-align: center;
  }

  .score-box .label { font-size: 0.65rem; opacity: 0.6; text-transform: uppercase; }
  .score-box .val   { font-size: 1.1rem; font-weight: 700; color: var(--accent); }

  canvas {
    border: 2px solid #39ff1444;
    border-radius: 12px;
    box-shadow: 0 0 30px #39ff1422, inset 0 0 20px #00000066;
    display: block;
    background: var(--grid);
    image-rendering: pixelated;
  }

  /* D-pad controls */
  .dpad {
    display: grid;
    grid-template-columns: 52px 52px 52px;
    grid-template-rows: 52px 52px 52px;
    gap: 4px;
    margin-top: 14px;
  }

  .dpad-btn {
    background: var(--surface);
    border: 1.5px solid #39ff1433;
    border-radius: 10px;
    color: var(--accent);
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, transform 0.1s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .dpad-btn:active {
    background: #39ff1422;
    transform: scale(0.92);
  }

  .dpad-btn.empty { background: transparent; border-color: transparent; pointer-events: none; }

  /* Overlay */
  #overlay {
    position: fixed;
    inset: 0;
    background: #0a0a0fcc;
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    gap: 16px;
  }

  #overlay h2 {
    font-size: 2rem;
    font-weight: 900;
    color: var(--accent);
    text-shadow: var(--glow);
  }

  #overlay p { font-size: 1rem; opacity: 0.7; }

  #overlay .final-score {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--food);
  }

  .btn-start {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 12px 36px;
    font-family: 'Cairo', sans-serif;
    font-size: 1.1rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: var(--glow);
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 8px;
  }

  .btn-start:active { transform: scale(0.95); }

  #snake-emoji {
    font-size: 3.5rem;
    animation: bounce 1s ease-in-out infinite alternate;
  }

  @keyframes bounce {
    from { transform: translateY(0); }
    to   { transform: translateY(-10px); }
  }
</style>
</head>
<body>

<h1>🐍 الثعبان</h1>

<div class="score-row">
  <div class="score-box">
    <div class="label">النقاط</div>
    <div class="val" id="scoreVal">0</div>
  </div>
  <div class="score-box">
    <div class="label">أعلى نقاط</div>
    <div class="val" id="highVal">0</div>
  </div>
  <div class="score-box">
    <div class="label">المستوى</div>
    <div class="val" id="levelVal">1</div>
  </div>
</div>

<canvas id="gameCanvas"></canvas>

<div class="dpad">
  <div class="dpad-btn empty"></div>
  <button class="dpad-btn" id="btnUp">▲</button>
  <div class="dpad-btn empty"></div>
  <button class="dpad-btn" id="btnLeft">◀</button>
  <div class="dpad-btn empty"></div>
  <button class="dpad-btn" id="btnRight">▶</button>
  <div class="dpad-btn empty"></div>
  <button class="dpad-btn" id="btnDown">▼</button>
  <div class="dpad-btn empty"></div>
</div>

<!-- Overlay -->
<div id="overlay">
  <div id="snake-emoji">🐍</div>
  <h2 id="overlayTitle">لعبة الثعبان</h2>
  <p id="overlayMsg">استخدم الأسهم أو الأزرار للتحكم</p>
  <p class="final-score" id="finalScore" style="display:none"></p>
  <button class="btn-start" id="btnStart">▶ ابدأ اللعبة</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// Responsive canvas size
const SIZE = Math.min(window.innerWidth - 32, 320);
const COLS = 20, ROWS = 20;
const CELL = Math.floor(SIZE / COLS);
canvas.width  = COLS * CELL;
canvas.height = ROWS * CELL;

let snake, dir, nextDir, food, score, highScore, level, speed, gameLoop, running;

highScore = parseInt(localStorage.getItem('snakeHigh') || '0');
document.getElementById('highVal').textContent = highScore;

function init() {
  snake   = [{x:10, y:10}, {x:9, y:10}, {x:8, y:10}];
  dir     = {x:1, y:0};
  nextDir = {x:1, y:0};
  score   = 0; level = 1; speed = 150;
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('levelVal').textContent = level;
  placeFood();
}

function placeFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while (snake.some(s => s.x===pos.x && s.y===pos.y));
  food = pos;
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { return gameOver(); }
  // Self collision
  if (snake.some(s => s.x===head.x && s.y===head.y)) { return gameOver(); }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10 * level;
    document.getElementById('scoreVal').textContent = score;
    if (score > highScore) {
      highScore = score;
      document.getElementById('highVal').textContent = highScore;
      localStorage.setItem('snakeHigh', highScore);
    }
    // Level up every 50 pts
    const newLevel = Math.floor(score / 50) + 1;
    if (newLevel > level) {
      level = newLevel;
      speed = Math.max(60, 150 - (level-1)*15);
      document.getElementById('levelVal').textContent = level;
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
    }
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid dots
  ctx.fillStyle = '#ffffff08';
  for (let x=0; x<COLS; x++) for (let y=0; y<ROWS; y++) {
    ctx.fillRect(x*CELL + CELL/2 - 1, y*CELL + CELL/2 - 1, 2, 2);
  }

  // Food with glow
  ctx.save();
  ctx.shadowColor = '#ff3860';
  ctx.shadowBlur  = 14;
  ctx.fillStyle   = '#ff3860';
  ctx.beginPath();
  ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL/2 - 2, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Snake
  snake.forEach((seg, i) => {
    ctx.save();
    const isHead = i === 0;
    ctx.shadowColor = isHead ? '#39ff14' : '#1aff0066';
    ctx.shadowBlur  = isHead ? 14 : 6;

    const ratio = 1 - (i / snake.length) * 0.5;
    ctx.fillStyle = isHead
      ? '#39ff14'
      : `rgba(${Math.round(26*ratio)}, ${Math.round(255*ratio)}, 0, ${0.9 - i*0.01})`;

    const pad = isHead ? 1 : 2;
    roundRect(ctx, seg.x*CELL+pad, seg.y*CELL+pad, CELL-pad*2, CELL-pad*2, isHead ? 5 : 3);
    ctx.fill();

    // Eyes on head
    if (isHead) {
      ctx.fillStyle = '#000';
      ctx.shadowBlur = 0;
      const ex = dir.y !== 0 ? [-3, 3] : [dir.x > 0 ? 3 : -5, dir.x > 0 ? 3 : -5];
      const ey = dir.x !== 0 ? [-3, 3] : [dir.y > 0 ? 3 : -5, dir.y > 0 ? 3 : -5];
      const cx_ = seg.x*CELL + CELL/2;
      const cy_ = seg.y*CELL + CELL/2;
      ctx.beginPath(); ctx.arc(cx_ + ex[0], cy_ + ey[0], 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx_ + ex[1], cy_ + ey[1], 2, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

function gameOver() {
  clearInterval(gameLoop);
  running = false;
  document.getElementById('overlayTitle').textContent = '💀 انتهت اللعبة!';
  document.getElementById('overlayMsg').textContent   = '';
  document.getElementById('finalScore').style.display = 'block';
  document.getElementById('finalScore').textContent   = `نقاطك: ${score} | المستوى: ${level}`;
  document.getElementById('btnStart').textContent     = '🔄 العب تاني';
  document.getElementById('overlay').style.display   = 'flex';
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('finalScore').style.display = 'none';
  init(); draw();
  clearInterval(gameLoop);
  running = true;
  gameLoop = setInterval(tick, speed);
}

// Keyboard
document.addEventListener('keydown', e => {
  if (!running) return;
  if (e.key==='ArrowUp'    && dir.y===0) nextDir={x:0,y:-1};
  if (e.key==='ArrowDown'  && dir.y===0) nextDir={x:0,y:1};
  if (e.key==='ArrowLeft'  && dir.x===0) nextDir={x:-1,y:0};
  if (e.key==='ArrowRight' && dir.x===0) nextDir={x:1,y:0};
});

// D-pad buttons
function setDir(dx, dy) {
  if (!running) return;
  if (dx !== 0 && dir.x === 0) nextDir={x:dx,y:0};
  if (dy !== 0 && dir.y === 0) nextDir={x:0,y:dy};
}
document.getElementById('btnUp').addEventListener('click',    () => setDir(0,-1));
document.getElementById('btnDown').addEventListener('click',  () => setDir(0,1));
document.getElementById('btnLeft').addEventListener('click',  () => setDir(-1,0));
document.getElementById('btnRight').addEventListener('click', () => setDir(1,0));

// Swipe touch
let tx=0, ty=0;
canvas.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e => {
  if (!running) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx>0?1:-1, 0);
  else                              setDir(0, dy>0?1:-1);
}, {passive:true});

document.getElementById('btnStart').addEventListener('click', startGame);

// Draw initial screen
init(); draw();
</script>
</body>
</html>
